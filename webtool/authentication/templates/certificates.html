<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issued Certificates - EasyAccess</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f9ff; margin: 0; padding: 0; }
    .navbar {
      background-color: #2c3e50;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h1 { margin: 0; font-size: 20px; }
    .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; cursor: pointer; }
    .nav-links a:hover { text-decoration: underline; }
    .container {
      max-width: 1000px;
      margin: 60px auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 { color: #2c3e50; margin-bottom: 30px; }
    .certificate {
      background: #f0f4f8;
      border-left: 5px solid #27ae60;
      margin-bottom: 30px;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
    }
    .certificate.revoked { border-left-color: #e74c3c; opacity: 0.85; }
    .certificate-label { font-weight: bold; margin-top: 8px; }
    .certificate pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      color: #333;
      background: #e6eef5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
    .no-cert { font-style: italic; color: #666; }
    .download-button, .revoke-button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 15px;
      font-size: 14px;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .download-button { background: #3498db; }
    .download-button:hover { background-color: #2980b9; }
    .revoke-button { background: #e74c3c; }
    .revoke-button:hover { background-color: #c0392b; }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>EasyAccess</h1>
    <div class="nav-links">
      <a href="/dashboard/">Dashboard</a>
      <a href="/profile/">User Profile</a>
      <a href="/certificates/">Issued Certificates</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </div>

  <div class="container">
    <h2>Your Issued Certificates</h2>
    <div id="certificates" class="certificates-list">
      <p class="no-cert">Fetching your certificates...</p>
    </div>
  </div>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function downloadCertificate(content, filename) {
      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || "ssh_certificate-cert.pub";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function addField(parent, labelText, valueText) {
      const label = document.createElement("div");
      label.className = "certificate-label";
      label.textContent = labelText;
      const val = document.createElement("div");
      val.textContent = valueText;
      parent.append(label, val);
    }

    async function loadCertificates() {
      const container = document.getElementById("certificates");
      const res = await fetch("/api/certificates/", { credentials: "same-origin" });
      if (res.status === 401 || res.status === 403) {
        window.location.href = "/login/";
        return;
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      container.replaceChildren();

      if (!data.certificates || data.certificates.length === 0) {
        const empty = document.createElement("p");
        empty.className = "no-cert";
        empty.textContent = "No certificates found.";
        container.appendChild(empty);
        return;
      }

      data.certificates.forEach(cert => {
        const certBlock = document.createElement("div");
        certBlock.className = cert.revoked ? "certificate revoked" : "certificate";

        addField(certBlock, "Issued At:", new Date(cert.issued_at).toLocaleString());
        addField(certBlock, "Valid Until:", new Date(cert.valid_until).toLocaleString());
        addField(certBlock, "Group:", cert.group || "N/A");
        addField(certBlock, "Principals:", cert.principals || cert.group || "N/A");
        addField(certBlock, "Status:", cert.revoked ? `Revoked (${new Date(cert.revoked_at).toLocaleString()})` : "Active");

        const preLabel = document.createElement("div");
        preLabel.className = "certificate-label";
        preLabel.textContent = "Certificate:";
        const pre = document.createElement("pre");
        pre.textContent = cert.cert;
        certBlock.append(preLabel, pre);

        const safeRole = (cert.group || "ssh_certificate").replace(/[^a-zA-Z0-9_-]/g, "_");
        const dlBtn = document.createElement("button");
        dlBtn.className = "download-button";
        dlBtn.textContent = "Download Certificate";
        dlBtn.addEventListener("click", () => downloadCertificate(cert.cert, `${safeRole}-cert.pub`));
        certBlock.appendChild(dlBtn);

        if (!cert.revoked) {
          const revokeBtn = document.createElement("button");
          revokeBtn.className = "revoke-button";
          revokeBtn.textContent = "Revoke Certificate";
          revokeBtn.addEventListener("click", async () => {
            if (!confirm("Revoke this certificate?")) return;
            const revRes = await fetch(`/api/certificates/${encodeURIComponent(cert.id)}/revoke/`, {
              method: "POST",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken")
              },
              body: JSON.stringify({})
            });
            if (revRes.ok) {
              loadCertificates();
            } else {
              alert("Failed to revoke certificate.");
            }
          });
          certBlock.appendChild(revokeBtn);
        }

        container.appendChild(certBlock);
      });
    }

    document.getElementById("logoutLink").addEventListener("click", async function (e) {
      e.preventDefault();
      try {
        const res = await fetch("/api/logout/", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
          },
          body: JSON.stringify({})
        });
        if (res.ok) {
          window.location.href = "/login/";
        } else {
          alert("Logout failed. Please try again.");
        }
      } catch (err) {
        alert("An error occurred during logout.");
      }
    });

    loadCertificates().catch(err => {
      const container = document.getElementById("certificates");
      container.replaceChildren();
      const errP = document.createElement("p");
      errP.className = "no-cert";
      errP.textContent = "Error fetching certificates: " + err.message;
      container.appendChild(errP);
    });
  </script>

</body>
</html>
