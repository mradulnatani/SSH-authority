<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { color: #60a5fa; font-size: 28px; margin-bottom: 25px; }
    form {
      background: rgba(30, 41, 59, 0.85);
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      width: 100%;
    }
    label { font-weight: 500; display: block; margin-bottom: 6px; color: #cbd5e1; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 14px;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
    button[type="submit"] {
      width: 100%;
      background-color: #3b82f6;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background-color: #2563eb; }
    #response {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
    }
    .error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
    .hint { text-align: center; margin-top: 14px; font-size: 14px; }
    .hint a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
  <label for="role">Login as:</label>
  <select id="role">
    <option value="user" selected>User</option>
    <option value="admin">Admin</option>
  </select>

  <label for="email">Email:</label>
  <input type="email" id="email" required>

  <label for="password">Password:</label>
  <input type="password" id="password" required>

  <button type="submit">Login</button>
  <div class="hint">Need an account? <a href="/register/">Register</a></div>
</form>

<p id="response"></p>

<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
    return "";
  }

  const roleSelect = document.getElementById("role");
  const responseEl = document.getElementById("response");

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    responseEl.className = "";
    responseEl.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const isAdmin = roleSelect.value === "admin";
    const endpoint = isAdmin ? "/api/admin/login/" : "/api/token/";
    const body = isAdmin ? { email, password, group: "ubuntu" } : { email, password };

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = "/dashboard/";
      } else {
        responseEl.textContent = data.detail || data.non_field_errors?.[0] || JSON.stringify(data);
        responseEl.className = "error";
      }
    } catch (err) {
      responseEl.textContent = "Login failed: " + err.message;
      responseEl.className = "error";
    }
  });
</script>

</body>
</html>
